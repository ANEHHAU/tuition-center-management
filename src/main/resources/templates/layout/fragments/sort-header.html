<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Sort Header Fragment -->
<th th:fragment="sortHeader(label, columnKey)" 
    scope="col" 
    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 sortable-header transition-colors group select-none"
    th:attr="data-sort=${columnKey}, onclick='window.ListHelper.setSort(\'' + ${columnKey} + '\')'">
    <div class="flex items-center space-x-1">
        <span th:text="${label}">Tiêu đề</span>
        <span class="sort-icon text-gray-400 group-hover:text-gray-600 transition-colors">↕</span>
    </div>
</th>

</body>
</html>
