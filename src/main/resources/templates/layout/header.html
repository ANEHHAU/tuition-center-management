<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

  <!-- Header Fragment -->
  <header th:fragment="header" class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 md:px-6 sticky top-0 z-10 shadow-sm">
    
    <!-- Bên trái: Nút hamburger cho Mobile -->
    <div class="flex items-center space-x-3">
      <button id="btn-hamburger" class="md:hidden p-2 rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-100 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <h1 class="text-lg font-semibold text-gray-800 hidden sm:block">Hệ thống Quản lý Trung tâm Dạy thêm</h1>
    </div>

    <!-- Bên phải: Thông tin User & Nút Logout -->
    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-3">
        <img id="header-user-avatar" 
             th:src="@{/images/default-avatar.svg}" 
             alt="Avatar" 
             class="w-9 h-9 rounded-full object-cover border border-gray-300">
        
        <div class="hidden sm:flex flex-col text-right">
          <span id="header-user-fullname" class="text-sm font-medium text-gray-900">User</span>
          <span id="header-user-role" class="text-xs text-blue-600 font-semibold">ROLE</span>
        </div>
      </div>

      <!-- Nút Đăng xuất -->
      <button onclick="window.authService.logout()" 
              class="px-3 py-1.5 text-xs font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-md border border-red-200 transition">
        Đăng xuất
      </button>
    </div>
  </header>

</body>
</html>
