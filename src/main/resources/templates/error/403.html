<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden - Truy cập bị từ chối</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
  <div class="text-center bg-white p-8 rounded-xl shadow-md max-w-md w-full">
    <h1 class="text-6xl font-extrabold text-red-500 mb-2">403</h1>
    <h2 class="text-xl font-bold text-gray-800 mb-2">Không có quyền truy cập</h2>
    <p class="text-sm text-gray-600 mb-6">Bạn không có quyền hạn thích hợp để xem trang này.</p>
    <a href="/login" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm transition">
      Quay về trang chính
    </a>
  </div>

</html>
