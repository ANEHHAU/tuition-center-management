<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - Tuition Center Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <script th:src="@{/js/api.js}"></script>
  <script th:src="@{/js/auth.js}"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 py-8">

  <div class="w-full max-w-lg bg-white rounded-xl shadow-md overflow-hidden p-6 sm:p-8">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">ĐĂNG KÝ TÀI KHOẢN</h2>
      <p class="text-sm text-gray-500 mt-1">Dành cho Giáo viên và Học sinh</p>
    </div>

    <!-- Thông báo lỗi -->
    <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg"></div>

    <form id="register-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Loại tài khoản (Role)</label>
        <div class="flex items-center space-x-6 py-1">
          <label class="inline-flex items-center text-sm text-gray-700 cursor-pointer">
            <input type="radio" name="role" value="STUDENT" checked class="w-4 h-4 text-blue-600">
            <span class="ml-2 font-medium">Học sinh (STUDENT)</span>
          </label>
          <label class="inline-flex items-center text-sm text-gray-700 cursor-pointer">
            <input type="radio" name="role" value="TEACHER" class="w-4 h-4 text-blue-600">
            <span class="ml-2 font-medium">Giáo viên (TEACHER)</span>
          </label>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập *</label>
          <input type="text" id="username" name="username" required
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Họ và tên *</label>
          <input type="text" id="fullName" name="fullName" required
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu * (min 6 ký tự)</label>
          <input type="password" id="password" name="password" required minlength="6"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Xác nhận mật khẩu *</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="email" name="email"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
          <input type="text" id="phone" name="phone"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Địa chỉ</label>
        <input type="text" id="address" name="address"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label for="note" class="block text-sm font-medium text-gray-700 mb-1">Ghi chú</label>
        <textarea id="note" name="note" rows="2"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition duration-200">
        Đăng ký tài khoản
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
      Đã có tài khoản? 
      <a href="/login" class="text-blue-600 hover:underline font-semibold">Đăng nhập ngay</a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const form = document.getElementById("register-form");
      const errorMsg = document.getElementById("error-msg");

      form.addEventListener("submit", async function(e) {
        e.preventDefault();
        errorMsg.classList.add("hidden");

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
          errorMsg.textContent = "Mật khẩu xác nhận không trùng khớp!";
          errorMsg.classList.remove("hidden");
          return;
        }

        const role = document.querySelector('input[name="role"]:checked').value;

        const payload = {
          username: document.getElementById("username").value.trim(),
          password: password,
          role: role,
          fullName: document.getElementById("fullName").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          address: document.getElementById("address").value.trim(),
          note: document.getElementById("note").value.trim()
        };

        try {
          await window.authService.register(payload);
        } catch (error) {
          errorMsg.textContent = error.message || "Đăng ký thất bại. Vui lòng kiểm tra lại!";
          errorMsg.classList.remove("hidden");
        }
      });
    });
  </script>

</body>
</html>
