<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Tuition Center Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <script th:src="@{/js/api.js}"></script>
  <script th:src="@{/js/auth.js}"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-white rounded-xl shadow-md overflow-hidden p-6 sm:p-8">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">ĐĂNG NHẬP</h2>
      <p class="text-sm text-gray-500 mt-1">Hệ thống Quản lý Trung tâm Dạy thêm</p>
    </div>

    <!-- Thông báo lỗi -->
    <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg"></div>

    <form id="login-form" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
        <input type="text" id="username" name="username" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm"
               placeholder="Nhập tên đăng nhập">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
        <input type="password" id="password" name="password" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm"
               placeholder="Nhập mật khẩu">
      </div>

      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition duration-200">
        Đăng nhập
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
      Chưa có tài khoản? 
      <a href="/register" class="text-blue-600 hover:underline font-semibold">Đăng ký ngay</a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Nếu đã có token và user trong localStorage -> tự động điều hướng vào trang chính
      const user = window.authService.getCurrentUser();
      if (user && localStorage.getItem("token")) {
        window.authService.redirectByRole(user.role);
        return;
      }

      const form = document.getElementById("login-form");
      const errorMsg = document.getElementById("error-msg");

      form.addEventListener("submit", async function(e) {
        e.preventDefault();
        errorMsg.classList.add("hidden");

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
          await window.authService.login(username, password);
        } catch (error) {
          errorMsg.textContent = error.message || "Đăng nhập thất bại. Vui lòng kiểm tra lại!";
          errorMsg.classList.remove("hidden");
        }
      });
    });
  </script>

</body>
</html>
