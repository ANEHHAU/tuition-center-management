<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>
  <main class="max-w-3xl mx-auto space-y-6">
    <div class="flex items-center space-x-4">
      <button onclick="window.history.back()" class="text-gray-500 hover:text-gray-700">
        &larr; Quay lại
      </button>
      <h2 class="text-2xl font-bold text-gray-800">Thông tin Buổi học</h2>
    </div>

    <div id="error-msg" class="text-red-600 text-sm"></div>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <form id="session-form" onsubmit="SessionManager.submitForm(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">ID Nhóm / Lớp *</label>
          <input type="number" name="groupId" required class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500" readonly>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Ngày học *</label>
            <input type="date" name="date" required class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Giờ bắt đầu *</label>
            <input type="time" name="startTime" required class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Giờ kết thúc *</label>
            <input type="time" name="endTime" required class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Phòng học</label>
            <input type="text" name="room" class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Trạng thái (chỉ dành cho update)</label>
            <select name="status" class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
              <option value="SCHEDULED">Sắp diễn ra</option>
              <option value="COMPLETED">Đã hoàn thành</option>
              <option value="CANCELLED">Đã hủy</option>
            </select>
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Ghi chú</label>
          <textarea name="note" rows="2" class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>

        <div class="pt-4 flex justify-end">
          <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-medium">Lưu buổi học</button>
        </div>
      </form>
    </div>

    <script th:src="@{/js/session.js}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        window.authService.requireAuth(['ADMIN']);
        SessionManager.init('ADMIN');
        
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const groupId = urlParams.get('groupId');
        
        if (id) {
          SessionManager.loadFormData(id);
        } else if (groupId) {
          document.getElementById('session-form').groupId.value = groupId;
        } else {
          document.getElementById('session-form').groupId.removeAttribute('readonly');
        }
      });
    </script>
  </main>
</body>
</html>
