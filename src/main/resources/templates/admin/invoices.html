<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::div})}">
<head><title>Quản lý Hóa đơn - Admin</title></head>
<body>
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">Quản lý Hóa đơn</h2>
        <button onclick="openGenerateModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition">+ Tạo hóa đơn tháng</button>
    </div>

    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 items-end flex-wrap">
        <div th:replace="~{layout/fragments/search-bar :: searchBar('Tìm theo tên, email hoặc SĐT học sinh...')}"></div>
        <div class="min-w-[100px]">
            <label class="block text-sm font-medium text-gray-700 mb-1">Tháng</label>
            <select id="filterMonth" class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm bg-white" onchange="window.ListHelper.setFilter('month', this.value)">
                <option value="">Tất cả</option>
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="11">11</option><option value="12">12</option>
            </select>
        </div>
        <div class="min-w-[100px]">
            <label class="block text-sm font-medium text-gray-700 mb-1">Năm</label>
            <input type="number" id="filterYear" class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm" placeholder="2026" onchange="window.ListHelper.setFilter('year', this.value)">
        </div>
        <div class="min-w-[140px]">
            <label class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
            <select id="filterStatus" class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm bg-white" onchange="window.ListHelper.setFilter('status', this.value)">
                <option value="">Tất cả</option>
                <option value="UNPAID">Chưa trả</option>
                <option value="PARTIAL">Trả 1 phần</option>
                <option value="PAID">Đã trả đủ</option>
                <option value="OVERDUE">Quá hạn</option>
            </select>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase w-16">STT</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Học sinh</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tháng/Năm</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Số buổi</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Tổng tiền</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Đã trả</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Còn nợ</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Trạng thái</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Hành động</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
        <div th:replace="~{layout/fragments/pagination :: pagination}"></div>
    </div>
</div>
<script src="/js/admin/invoices.js"></script>
</body>
</html>
