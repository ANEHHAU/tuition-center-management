<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::div})}">
<head><title>Điểm danh - Admin</title></head>
<body>
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">Điểm danh Buổi học</h2>
        <a href="/admin/sessions" class="text-sm text-blue-600 hover:underline">← Danh sách buổi học</a>
    </div>

    <!-- Thông tin Session -->
    <div id="sessionInfo" class="bg-white p-4 rounded-lg shadow-sm border grid grid-cols-1 md:grid-cols-4 gap-4">
        <div><p class="text-xs text-gray-500 uppercase">Nhóm</p><p id="infoGroup" class="font-semibold">-</p></div>
        <div><p class="text-xs text-gray-500 uppercase">Ngày</p><p id="infoDate" class="font-semibold">-</p></div>
        <div><p class="text-xs text-gray-500 uppercase">Giờ</p><p id="infoTime" class="font-semibold">-</p></div>
        <div><p class="text-xs text-gray-500 uppercase">Phòng</p><p id="infoRoom" class="font-semibold">-</p></div>
    </div>

    <!-- Bảng điểm danh -->
    <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
        <div class="p-4 border-b flex justify-between items-center">
            <h3 class="text-lg font-semibold">Danh sách Học sinh</h3>
            <button onclick="saveAttendance()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-medium">💾 Lưu điểm danh</button>
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase w-16">STT</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Họ tên</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Trạng thái</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Giá chốt</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ghi chú</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>

<script src="/js/admin/attendance.js"></script>
</div>
</body>
</html>
