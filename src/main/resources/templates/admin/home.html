<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>

  <main class="space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">Dashboard</h2>
        <p class="text-sm text-gray-500">Tổng quan hệ thống.</p>
      </div>
      <span class="px-3 py-1 bg-purple-100 text-purple-800 font-semibold text-xs rounded-full">ADMIN</span>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
      <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center hover:shadow-md transition">
        <p class="text-xs font-semibold text-gray-500 uppercase">Người dùng</p>
        <h3 id="statUsers" class="text-3xl font-bold text-blue-600 mt-2">-</h3>
      </div>
      <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center hover:shadow-md transition">
        <p class="text-xs font-semibold text-gray-500 uppercase">Giáo viên</p>
        <h3 id="statTeachers" class="text-3xl font-bold text-green-600 mt-2">-</h3>
      </div>
      <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center hover:shadow-md transition">
        <p class="text-xs font-semibold text-gray-500 uppercase">Học sinh</p>
        <h3 id="statStudents" class="text-3xl font-bold text-purple-600 mt-2">-</h3>
      </div>
      <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center hover:shadow-md transition">
        <p class="text-xs font-semibold text-gray-500 uppercase">Khóa học</p>
        <h3 id="statCourses" class="text-3xl font-bold text-orange-600 mt-2">-</h3>
      </div>
      <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center hover:shadow-md transition">
        <p class="text-xs font-semibold text-gray-500 uppercase">Nhóm học</p>
        <h3 id="statGroups" class="text-3xl font-bold text-red-600 mt-2">-</h3>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Chart -->
        <div class="lg:col-span-2 bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Doanh thu 30 ngày gần nhất</h3>
            <div class="h-64 flex items-center justify-center bg-gray-50 rounded border border-dashed border-gray-300 text-gray-400">
                [Biểu đồ doanh thu - Đang phát triển]
            </div>
        </div>

        <!-- Recent Activities -->
        <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">Hoạt động gần đây</h3>
                <a href="/admin/audit-log" class="text-sm text-blue-600 hover:underline">Xem tất cả</a>
            </div>
            <div class="flex-1 overflow-y-auto pr-2" id="recentActivities">
                <p class="text-sm text-center text-gray-500 mt-10">Đang tải...</p>
            </div>
        </div>
    </div>

    <script src="/js/admin/dashboard.js"></script>
  </main>

</body>
</html>
