<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>

  <main class="space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">Trang chủ Quản trị (ADMIN)</h2>
        <p class="text-sm text-gray-500">Quản lý toàn bộ trung tâm của bạn.</p>
      </div>
      <span class="px-3 py-1 bg-purple-100 text-purple-800 font-semibold text-xs rounded-full">ADMIN</span>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-500 uppercase">Tổng Khóa Học</p>
        <h3 class="text-2xl font-bold text-gray-800 mt-1">Đang hoạt động</h3>
      </div>
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-500 uppercase">Tổng Học Sinh</p>
        <h3 class="text-2xl font-bold text-gray-800 mt-1">Toàn hệ thống</h3>
      </div>
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-500 uppercase">Doanh thu</p>
        <h3 class="text-2xl font-bold text-gray-800 mt-1">Tháng này</h3>
      </div>
    </div>

    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
      <h3 class="text-lg font-bold text-gray-800 mb-3">Thông báo hệ thống</h3>
      <p class="text-sm text-gray-600">Hệ thống đang hoạt động bình thường.</p>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        window.authService.requireAuth(['ADMIN']);
      });
    </script>
  </main>

</body>
</html>
