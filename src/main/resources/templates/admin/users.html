<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::div})}">
<head>
    <title>Quản lý Người dùng - Admin</title>
</head>
<body>

<div class="space-y-6">
    <!-- Header Page -->
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">Quản lý Người dùng</h2>
        <button onclick="openModal('user-modal')" 
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md shadow-sm text-sm font-medium transition flex items-center space-x-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            <span>Thêm mới</span>
        </button>
    </div>

    <!-- Filters & Search -->
    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 justify-between items-center">
        
        <!-- Search Component -->
        <div th:replace="~{layout/fragments/search-bar :: searchBar('Tìm theo tên, email hoặc SĐT...')}"></div>
        
        <!-- Filters -->
        <div class="flex flex-wrap items-center gap-3">
            <select id="filterRole" class="border border-gray-300 rounded-md py-2 px-3 text-sm focus:ring-blue-500 focus:border-blue-500 bg-white shadow-sm" onchange="window.ListHelper.setFilter('role', this.value)">
                <option value="">Tất cả vai trò</option>
                <option value="ADMIN">Admin</option>
                <option value="TEACHER">Giáo viên</option>
                <option value="STUDENT">Học sinh</option>
            </select>
            
            <select id="filterStatus" class="border border-gray-300 rounded-md py-2 px-3 text-sm focus:ring-blue-500 focus:border-blue-500 bg-white shadow-sm" onchange="window.ListHelper.setFilter('status', this.value)">
                <option value="">Tất cả trạng thái</option>
                <option value="ACTIVE">Hoạt động</option>
                <option value="INACTIVE">Đã khóa</option>
            </select>
        </div>
    </div>

    <!-- Data Table -->
    <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-16">STT</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Avatar</th>
                        <th th:replace="~{layout/fragments/sort-header :: sortHeader('Tên đăng nhập', 'username')}"></th>
                        <th th:replace="~{layout/fragments/sort-header :: sortHeader('Họ và tên', 'name')}"></th>
                        <th th:replace="~{layout/fragments/sort-header :: sortHeader('Email', 'email')}"></th>
                        <th th:replace="~{layout/fragments/sort-header :: sortHeader('Số điện thoại', 'phone')}"></th>
                        <th th:replace="~{layout/fragments/sort-header :: sortHeader('Vai trò', 'role')}"></th>
                        <th th:replace="~{layout/fragments/sort-header :: sortHeader('Trạng thái', 'status')}"></th>
                        <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Hành động</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                    <!-- Dữ liệu sẽ được render bằng JS -->
                </tbody>
            </table>
        </div>
        
        <!-- Pagination Component -->
        <div th:replace="~{layout/fragments/pagination :: pagination}"></div>
    </div>
</div>

<!-- Thêm file JS xử lý nghiệp vụ -->
<script src="/js/admin/users.js"></script>
</body>
</html>
