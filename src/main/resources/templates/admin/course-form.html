<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>
  <main class="max-w-3xl mx-auto space-y-6">
    <div class="flex items-center space-x-4">
      <button onclick="window.history.back()" class="text-gray-500 hover:text-gray-700">
        &larr; Quay lại
      </button>
      <h2 class="text-2xl font-bold text-gray-800">Thông tin Khóa học</h2>
    </div>

    <div id="error-msg" class="text-red-600 text-sm"></div>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <form id="course-form" onsubmit="CourseManager.submitForm(event)" class="space-y-4">
        
        <!-- Chọn Giáo viên phụ trách (ADMIN) -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Giáo viên phụ trách *</label>
          <div class="flex space-x-2">
            <input type="hidden" name="teacherId" id="selected-teacher-id" required>
            <input type="text" id="selected-teacher-display" readonly placeholder="Chưa chọn giáo viên"
                   class="flex-1 px-4 py-2 border rounded bg-gray-50 text-gray-700 focus:ring-blue-500 focus:border-blue-500 cursor-pointer"
                   onclick="openTeacherModal()">
            <button type="button" onclick="openTeacherModal()"
                    class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 shrink-0">Chọn GV</button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tên khóa học *</label>
          <input type="text" name="name" required class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Học phí một buổi (VNĐ) *</label>
          <input type="number" name="pricePerSession" required min="0" class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
          <select name="status" class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
            <option value="ACTIVE">Hoạt động (ACTIVE)</option>
            <option value="INACTIVE">Ngưng hoạt động (INACTIVE)</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
          <textarea name="description" rows="4" class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>

        <div class="pt-4 flex justify-end">
          <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-medium">Lưu khóa học</button>
        </div>
      </form>
    </div>

    <!-- ========== MODAL CHỌN GIÁO VIÊN ========== -->
    <div id="teacher-modal" class="fixed inset-0 z-50 hidden">
      <!-- Overlay mờ -->
      <div class="absolute inset-0 bg-black/50" onclick="closeTeacherModal()"></div>
      
      <!-- Modal content -->
      <div class="absolute inset-4 md:inset-x-auto md:inset-y-8 md:max-w-3xl md:mx-auto bg-white rounded-xl shadow-2xl flex flex-col overflow-hidden">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between bg-gray-50">
          <h3 class="text-lg font-bold text-gray-800">Chọn Giáo viên phụ trách</h3>
          <button onclick="closeTeacherModal()" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
        </div>

        <!-- Ô tìm kiếm -->
        <div class="px-6 py-3 border-b border-gray-100">
          <input type="text" id="teacher-search-input" placeholder="Tìm theo tên, email, SĐT, ghi chú..."
                 oninput="filterTeacherList()"
                 class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500 text-sm">
        </div>

        <!-- Bảng danh sách -->
        <div class="flex-1 overflow-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead class="bg-gray-100 sticky top-0">
              <tr>
                <th class="px-4 py-3 font-medium text-gray-600">ID</th>
                <th class="px-4 py-3 font-medium text-gray-600">Họ tên</th>
                <th class="px-4 py-3 font-medium text-gray-600">Email</th>
                <th class="px-4 py-3 font-medium text-gray-600">SĐT</th>
                <th class="px-4 py-3 font-medium text-gray-600">Ghi chú</th>
                <th class="px-4 py-3 font-medium text-gray-600 text-center">Chọn</th>
              </tr>
            </thead>
            <tbody id="teacher-list-tbody">
              <!-- Render by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script th:src="@{/js/course.js}"></script>
    <script>
      // Danh sách giáo viên đã fetch từ API
      let allTeachers = [];

      async function openTeacherModal() {
        document.getElementById('teacher-modal').classList.remove('hidden');
        if (allTeachers.length === 0) {
          try {
            allTeachers = await apiFetch('/api/admin/users?role=TEACHER');
          } catch(e) {
            alert('Lỗi tải danh sách GV: ' + e.message);
            return;
          }
        }
        renderTeacherList(allTeachers);
      }

      function closeTeacherModal() {
        document.getElementById('teacher-modal').classList.add('hidden');
      }

      function renderTeacherList(teachers) {
        const tbody = document.getElementById('teacher-list-tbody');
        if (teachers.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">Không tìm thấy giáo viên nào.</td></tr>';
          return;
        }
        tbody.innerHTML = teachers.map(t => `
          <tr class="border-b hover:bg-blue-50 cursor-pointer">
            <td class="px-4 py-3">${t.id}</td>
            <td class="px-4 py-3 font-medium">${t.fullName || ''}</td>
            <td class="px-4 py-3">${t.email || ''}</td>
            <td class="px-4 py-3">${t.phone || ''}</td>
            <td class="px-4 py-3 text-gray-500 text-xs">${t.note || ''}</td>
            <td class="px-4 py-3 text-center">
              <button type="button" onclick="selectTeacher(${t.id}, '${(t.fullName || '').replace(/'/g, "\\'")}', '${t.email || ''}')"
                      class="px-3 py-1.5 bg-blue-600 text-white rounded text-xs hover:bg-blue-700 font-medium">Chọn</button>
            </td>
          </tr>
        `).join('');
      }

      function filterTeacherList() {
        const kw = document.getElementById('teacher-search-input').value.toLowerCase();
        if (!kw) { renderTeacherList(allTeachers); return; }
        const filtered = allTeachers.filter(t =>
          (t.fullName && t.fullName.toLowerCase().includes(kw)) ||
          (t.email && t.email.toLowerCase().includes(kw)) ||
          (t.phone && t.phone.toLowerCase().includes(kw)) ||
          (t.note && t.note.toLowerCase().includes(kw)) ||
          (String(t.id).includes(kw))
        );
        renderTeacherList(filtered);
      }

      function selectTeacher(id, name, email) {
        document.getElementById('selected-teacher-id').value = id;
        document.getElementById('selected-teacher-display').value = `[ID: ${id}] ${name} (${email})`;
        closeTeacherModal();
      }

      document.addEventListener("DOMContentLoaded", function() {
        window.authService.requireAuth(['ADMIN']);
        CourseManager.init('ADMIN');
        const urlParams = new URLSearchParams(window.location.search);
        CourseManager.loadFormData(urlParams.get('id'));
      });
    </script>
  </main>
</body>
</html>
