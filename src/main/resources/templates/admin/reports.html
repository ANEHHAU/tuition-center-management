<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::div})}">
<head><title>Báo cáo Thống kê - Admin</title></head>
<body>
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">Báo cáo & Thống kê</h2>
        <button class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-medium transition flex items-center gap-2">
            📊 Tải Excel
        </button>
    </div>

    <!-- Tabs -->
    <div class="bg-white border-b border-gray-200">
        <nav class="-mb-px flex space-x-8 px-4" aria-label="Tabs">
            <button class="border-blue-500 text-blue-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">Doanh thu</button>
            <button class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">Top Giáo viên</button>
            <button class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">Công nợ</button>
            <button class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">Tỷ lệ đi học</button>
        </nav>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-sm border text-center text-gray-500 py-12">
        <p>Tính năng Biểu đồ & Thống kê chi tiết đang được phát triển trong Phase tiếp theo.</p>
    </div>
</div>
</body>
</html>
