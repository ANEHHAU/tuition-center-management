<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>
  <main class="space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-4 sm:space-y-0">
      <h2 class="text-2xl font-bold text-gray-800">Quản lý Buổi học</h2>
      <a href="session-form" class="px-4 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700">Lên lịch buổi học</a>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <div class="flex items-end space-x-4">
        <div class="w-64">
          <label class="block text-sm font-medium text-gray-700 mb-1">Chọn Lớp / Nhóm</label>
          <select id="group-select" class="w-full px-3 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
            <option value="">-- Chọn lớp --</option>
          </select>
        </div>
        <button id="btn-load-sessions" class="px-4 py-2 bg-gray-800 text-white rounded hover:bg-gray-900">Xem lịch</button>
      </div>
    </div>

    <div id="error-msg" class="text-red-600 text-sm"></div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-gray-600 text-sm uppercase tracking-wider border-b">
              <th class="px-4 py-3 font-medium">Ngày học</th>
              <th class="px-4 py-3 font-medium">Giờ học</th>
              <th class="px-4 py-3 font-medium">Phòng</th>
              <th class="px-4 py-3 font-medium">Trạng thái</th>
              <th class="px-4 py-3 font-medium">Đã điểm danh</th>
              <th class="px-4 py-3 font-medium">Hành động</th>
            </tr>
          </thead>
          <tbody id="sessions-tbody">
            <!-- Render by JS -->
            <tr><td colspan="6" class="px-4 py-4 text-center text-gray-500">Vui lòng chọn lớp để xem lịch học.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <script th:src="@{/js/session.js}"></script>
    <script th:src="@{/js/group.js}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function() {
        window.authService.requireAuth(['ADMIN']);
        SessionManager.init('ADMIN');
        
        // Load groups to select
        try {
            const groups = await apiFetch('/api/admin/groups');
            const select = document.getElementById('group-select');
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = g.name;
                select.appendChild(opt);
            });
        } catch(e) {}

        document.getElementById('btn-load-sessions').onclick = () => {
            const groupId = document.getElementById('group-select').value;
            if (groupId) SessionManager.loadSessions(groupId);
        };
      });
    </script>
  </main>
</body>
</html>
