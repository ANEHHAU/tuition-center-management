<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::div})}">
<head><title>Quản lý Buổi học - Admin</title></head>
<body>
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">Quản lý Buổi học (Session)</h2>
        <div class="flex gap-2">
            <a href="/admin/session-form" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition">+ Tạo buổi</a>
        </div>
    </div>

    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 items-end flex-wrap">
        <div class="flex-1 min-w-[180px]">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nhóm học</label>
            <select id="filterGroupId" class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm bg-white" onchange="window.ListHelper.setFilter('groupId', this.value)">
                <option value="">Tất cả nhóm</option>
            </select>
        </div>
        <div class="min-w-[150px]">
            <label class="block text-sm font-medium text-gray-700 mb-1">Từ ngày</label>
            <input type="date" id="filterFrom" class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm" onchange="window.ListHelper.setFilter('from', this.value)">
        </div>
        <div class="min-w-[150px]">
            <label class="block text-sm font-medium text-gray-700 mb-1">Đến ngày</label>
            <input type="date" id="filterTo" class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm" onchange="window.ListHelper.setFilter('to', this.value)">
        </div>
        <div class="min-w-[150px]">
            <label class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
            <select id="filterStatus" class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm bg-white" onchange="window.ListHelper.setFilter('status', this.value)">
                <option value="">Tất cả</option>
                <option value="SCHEDULED">Đã lên lịch</option>
                <option value="COMPLETED">Đã hoàn thành</option>
                <option value="CANCELLED">Đã hủy</option>
            </select>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase w-16">STT</th>
                        <th th:replace="~{layout/fragments/sort-header :: sortHeader('Ngày', 'date')}"></th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Giờ</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nhóm</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Khóa học</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Phòng</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Trạng thái</th>
                        <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Hành động</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
        <div th:replace="~{layout/fragments/pagination :: pagination}"></div>
    </div>

<script src="/js/admin/sessions.js"></script>
</div>
</body>
</html>
