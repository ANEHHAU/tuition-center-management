<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::div})}">
<head><title>Chi tiết Hóa đơn - Admin</title></head>
<body>
<div class="space-y-6">
    <div>
        <a href="/admin/invoices" class="text-sm text-blue-600 hover:underline">← Quay lại danh sách hóa đơn</a>
        <h2 id="invoiceTitle" class="text-2xl font-bold text-gray-800 mt-1">Chi tiết Hóa đơn</h2>
    </div>

    <!-- Thông tin chung -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-lg shadow-sm border">
            <p class="text-xs text-gray-500 uppercase">Học sinh</p>
            <p id="infoStudent" class="text-lg font-semibold mt-1">-</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border">
            <p class="text-xs text-gray-500 uppercase">Tháng/Năm</p>
            <p id="infoMonthYear" class="text-lg font-semibold mt-1">-</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border">
            <p class="text-xs text-gray-500 uppercase">Tổng tiền</p>
            <p id="infoTotal" class="text-lg font-semibold mt-1 text-blue-700">-</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border">
            <p class="text-xs text-gray-500 uppercase">Trạng thái</p>
            <p id="infoStatus" class="text-lg font-semibold mt-1">-</p>
        </div>
    </div>

    <!-- Actions -->
    <div class="bg-white p-4 rounded-lg shadow-sm border flex flex-wrap gap-3">
        <button id="btnFinalize" onclick="finalizeInvoice()" class="bg-green-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-green-700">✅ Finalize</button>
        <button id="btnRegenerate" onclick="regenerateInvoice()" class="bg-yellow-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-yellow-600">🔄 Tính lại</button>
        <button onclick="openPaymentModal()" class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-700">💳 Ghi nhận thanh toán</button>
    </div>

    <!-- Bảng chi tiết từng buổi -->
    <div class="bg-white rounded-lg shadow overflow-hidden border">
        <div class="p-4 border-b"><h3 class="font-semibold text-gray-800">📋 Chi tiết từng buổi</h3></div>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ngày</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Khóa học</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Giá</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Trạng thái ĐD</th>
                    </tr>
                </thead>
                <tbody id="detailBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>

    <!-- Lịch sử thanh toán -->
    <div class="bg-white rounded-lg shadow overflow-hidden border">
        <div class="p-4 border-b"><h3 class="font-semibold text-gray-800">💰 Lịch sử Thanh toán</h3></div>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ngày TT</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Số tiền</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Phương thức</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ghi chú</th>
                    </tr>
                </thead>
                <tbody id="paymentBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>

<script src="/js/admin/invoice-detail.js"></script>
</div>
</body>
</html>
