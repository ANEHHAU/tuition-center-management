<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::div})}">
<head><title>Chi tiết Nhóm học - Admin</title></head>
<body>
<div class="space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center">
        <div>
            <a href="/admin/groups" class="text-sm text-blue-600 hover:underline">← Quay lại danh sách</a>
            <h2 id="groupTitle" class="text-2xl font-bold text-gray-800 mt-1">Chi tiết Nhóm học</h2>
        </div>
        <div class="flex gap-2">
            <a id="editGroupBtn" href="#" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-md text-sm font-medium transition">Sửa thông tin</a>
        </div>
    </div>

    <!-- Group Info Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-4 rounded-lg shadow-sm border">
            <p class="text-xs text-gray-500 uppercase font-medium">Khóa học</p>
            <p id="infoCourseName" class="text-lg font-semibold text-gray-800 mt-1">-</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border">
            <p class="text-xs text-gray-500 uppercase font-medium">Giáo viên</p>
            <p id="infoTeacherName" class="text-lg font-semibold text-gray-800 mt-1">-</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border">
            <p class="text-xs text-gray-500 uppercase font-medium">Trạng thái / Số HS</p>
            <p id="infoStatusCount" class="text-lg font-semibold text-gray-800 mt-1">-</p>
        </div>
    </div>

    <!-- Public Link -->
    <div class="bg-white p-4 rounded-lg shadow-sm border space-y-3">
        <h3 class="text-lg font-semibold text-gray-800">🔗 Public Link (Liên kết đăng ký công khai)</h3>
        <div class="flex flex-col sm:flex-row gap-2 items-start sm:items-center">
            <input id="publicLinkUrl" type="text" readonly class="flex-1 w-full border border-gray-300 rounded-md py-2 px-3 text-sm bg-gray-50 text-gray-700">
            <button onclick="copyPublicLink()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-md text-sm font-medium">📋 Copy</button>
            <button onclick="regenerateLink()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded-md text-sm font-medium">🔄 Tạo lại</button>
            <button onclick="revokeLink()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-md text-sm font-medium">🚫 Thu hồi</button>
        </div>
    </div>

    <!-- Danh sách HS trong nhóm -->
    <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
        <div class="p-4 border-b flex justify-between items-center">
            <h3 class="text-lg font-semibold text-gray-800">📚 Học sinh trong nhóm</h3>
            <button onclick="openAddStudentModal()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-md text-sm font-medium">+ Thêm HS</button>
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase w-16">STT</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Họ tên</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">SĐT</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ngày tham gia</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Hành động</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>
</div>
<script src="/js/admin/group-detail.js"></script>
</body>
</html>
