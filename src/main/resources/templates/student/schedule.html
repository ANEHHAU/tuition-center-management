<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>
  <main class="space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-4 sm:space-y-0">
      <h2 class="text-2xl font-bold text-gray-800">Lịch học của tôi</h2>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <div class="flex space-x-4 items-end">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Từ ngày</label>
          <input type="date" id="from-date" class="w-full px-3 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Đến ngày</label>
          <input type="date" id="to-date" class="w-full px-3 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
        </div>
        <button id="btn-load-schedule" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Xem lịch</button>
      </div>
    </div>

    <div id="error-msg" class="text-red-600 text-sm"></div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-gray-600 text-sm uppercase tracking-wider border-b">
              <th class="px-4 py-3 font-medium">Ngày học</th>
              <th class="px-4 py-3 font-medium">Giờ học</th>
              <th class="px-4 py-3 font-medium">Khóa học / Lớp</th>
              <th class="px-4 py-3 font-medium">Phòng học</th>
              <th class="px-4 py-3 font-medium">Trạng thái</th>
            </tr>
          </thead>
          <tbody id="schedule-tbody">
            <!-- Render by JS -->
          </tbody>
        </table>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        window.authService.requireAuth(['STUDENT']);

        const now = new Date();
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
        const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
        document.getElementById('from-date').value = firstDay;
        document.getElementById('to-date').value = lastDay;

        document.getElementById('btn-load-schedule').onclick = async () => {
            const from = document.getElementById('from-date').value;
            const to = document.getElementById('to-date').value;
            try {
                const schedule = await apiFetch(`/api/student/schedule?from=${from}&to=${to}`);
                const tbody = document.getElementById('schedule-tbody');
                if (schedule.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-4 text-center text-gray-500">Không có lịch học trong khoảng thời gian này.</td></tr>';
                    return;
                }
                tbody.innerHTML = schedule.map(s => `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="px-4 py-3 text-sm">${s.date}</td>
                        <td class="px-4 py-3 text-sm font-medium">${s.startTime} - ${s.endTime}</td>
                        <td class="px-4 py-3 text-sm">
                            <div class="font-bold text-gray-800">${s.courseName}</div>
                            <div class="text-xs text-gray-500">${s.groupName}</div>
                        </td>
                        <td class="px-4 py-3 text-sm">${s.room || 'Chưa xếp'}</td>
                        <td class="px-4 py-3 text-sm">
                            <span class="px-2 py-1 rounded-full text-xs font-medium ${s.status === 'CANCELLED' ? 'bg-red-100 text-red-800' : s.status === 'COMPLETED' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800'}">${s.status}</span>
                        </td>
                    </tr>
                `).join('');
            } catch(e) {
                document.getElementById('error-msg').textContent = e.message;
            }
        };

        // Auto load
        document.getElementById('btn-load-schedule').click();
      });
    </script>
  </main>
</body>
</html>
