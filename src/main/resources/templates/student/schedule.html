<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<head>
  <title>Lịch Học Của Tôi</title>
</head>
<body>
  <div th:fragment="content">
    <div class="mb-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-800">Lịch Học Của Tôi</h1>
    </div>

    <!-- Filter -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4 items-center mb-6 justify-between">
      <div class="flex items-center space-x-3 w-full md:w-auto">
        <input type="date" id="filterFrom" class="border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500 w-full md:w-auto" onchange="ListHelper.setFilter('from', this.value)">
        <span class="text-gray-500">-</span>
        <input type="date" id="filterTo" class="border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500 w-full md:w-auto" onchange="ListHelper.setFilter('to', this.value)">
      </div>
      <div class="w-full md:w-auto">
        <select id="filterCourse" class="border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500 w-full md:w-auto" onchange="ListHelper.setFilter('courseId', this.value)">
            <option value="">Tất cả khóa học</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[600px]">
          <thead>
            <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider border-b">
              <th th:replace="~{layout/fragments/sort-header :: sortHeader('Ngày', 'date')}"></th>
              <th class="px-4 py-3 font-medium">Thời gian</th>
              <th class="px-4 py-3 font-medium">Nhóm</th>
              <th class="px-4 py-3 font-medium">Khóa học</th>
              <th class="px-4 py-3 font-medium">Phòng</th>
              <th class="px-4 py-3 font-medium text-right">Chi tiết</th>
            </tr>
          </thead>
          <tbody id="scheduleTableBody" class="text-sm text-gray-700 divide-y divide-gray-100">
            <!-- Data will be rendered here -->
          </tbody>
        </table>
      </div>
      
      <div th:replace="~{layout/fragments/pagination :: pagination}"></div>
    </div>
  
<script src="/js/list-helper.js"></script>
    <script src="/js/student/schedule.js"></script>
</div>
</body>
</html>
