<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<head><title>Chi Tiết Buổi Học</title></head>
<body>
<div th:fragment="content">
  <div class="mb-6 flex items-center space-x-3">
    <a href="/student/schedule" class="text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100 transition-colors">
      <i class="fas fa-arrow-left"></i>
    </a>
    <h1 class="text-2xl font-bold text-gray-800">Chi Tiết Buổi Học</h1>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Session Info -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="font-bold text-gray-800 mb-4 flex items-center"><i class="fas fa-calendar-day text-blue-500 mr-2"></i> Thông tin buổi học</h2>
      <div id="sessionInfo" class="space-y-4">
        <p class="text-gray-400">Đang tải...</p>
      </div>
    </div>

    <!-- Attendance Status -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="font-bold text-gray-800 mb-4 flex items-center"><i class="fas fa-user-check text-green-500 mr-2"></i> Trạng thái điểm danh</h2>
      <div id="attendanceStatus">
        <p class="text-gray-400">Đang tải...</p>
      </div>
    </div>
  </div>

<script src="/js/student/schedule.js"></script>
</div>
</body>
</html>
