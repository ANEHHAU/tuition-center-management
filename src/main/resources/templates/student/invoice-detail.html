<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<head><title>Chi Tiết Hóa Đơn</title></head>
<body>
<div th:fragment="content">
  <div class="mb-6 flex items-center space-x-3">
    <a href="/student/invoices" class="text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100 transition-colors">
      <i class="fas fa-arrow-left"></i>
    </a>
    <h1 class="text-2xl font-bold text-gray-800">Chi Tiết Hóa Đơn</h1>
  </div>

  <!-- Invoice Header Info -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6" id="invoiceHeader">
    <p class="text-gray-400">Đang tải...</p>
  </div>

  <!-- Breakdown Table -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
    <div class="p-4 border-b border-gray-100 flex items-center justify-between">
      <h2 class="font-bold text-gray-800 flex items-center"><i class="fas fa-list text-blue-500 mr-2"></i> Chi tiết các buổi học</h2>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse min-w-[500px]">
        <thead>
          <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider border-b">
            <th class="px-4 py-3 font-medium">Ngày</th>
            <th class="px-4 py-3 font-medium">Nhóm</th>
            <th class="px-4 py-3 font-medium">Trạng thái ĐD</th>
            <th class="px-4 py-3 font-medium text-right">Tiền</th>
          </tr>
        </thead>
        <tbody id="breakdownTableBody" class="text-sm text-gray-700 divide-y divide-gray-100">
        </tbody>
      </table>
    </div>
  </div>

  <!-- Payment History -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
    <h2 class="font-bold text-gray-800 mb-4 flex items-center"><i class="fas fa-history text-indigo-500 mr-2"></i> Lịch sử thanh toán</h2>
    <div id="paymentHistory">
      <p class="text-gray-500 text-sm">Chưa có thanh toán nào.</p>
    </div>
  </div>

  <!-- Action: Notify Payment (only if not fully paid) -->
  <div id="notifySection" class="hidden bg-yellow-50 border border-yellow-200 rounded-xl p-6">
    <h3 class="font-bold text-yellow-800 mb-3 flex items-center"><i class="fas fa-bell mr-2"></i> Báo đã chuyển khoản</h3>
    <p class="text-sm text-yellow-700 mb-4">Sau khi chuyển khoản, hãy thông báo cho giáo viên xác nhận.</p>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Số tiền chuyển (₫)</label>
        <input type="number" id="notifyAmount" class="w-full border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="0">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Phương thức</label>
        <select id="notifyMethod" class="w-full border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500">
          <option value="BANK_TRANSFER">Chuyển khoản ngân hàng</option>
          <option value="MOMO">MoMo</option>
          <option value="CASH">Tiền mặt</option>
          <option value="OTHER">Khác</option>
        </select>
      </div>
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Ghi chú</label>
      <input type="text" id="notifyNote" class="w-full border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Nội dung chuyển khoản, ngày giờ...">
    </div>
    <button onclick="submitNotifyPayment()" class="px-6 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 transition-colors font-medium">
      <i class="fas fa-paper-plane mr-2"></i> Gửi thông báo
    </button>
  </div>

<script src="/js/student/invoice.js"></script>
</div>
</body>
</html>
