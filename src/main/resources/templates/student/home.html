<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>

  <main class="space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">Trang chủ Học sinh (STUDENT)</h2>
        <p class="text-sm text-gray-500">Xem lịch học, điểm số và thông tin khóa học đăng ký.</p>
      </div>
      <span class="px-3 py-1 bg-amber-100 text-amber-800 font-semibold text-xs rounded-full">STUDENT</span>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-500 uppercase">Khóa học đã đăng ký</p>
        <h3 class="text-2xl font-bold text-gray-800 mt-1">3 Môn học</h3>
      </div>
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-500 uppercase">Buổi học trong tuần</p>
        <h3 class="text-2xl font-bold text-gray-800 mt-1">6 Buổi</h3>
      </div>
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-500 uppercase">Tỷ lệ đi học</p>
        <h3 class="text-2xl font-bold text-green-600 mt-1">98%</h3>
      </div>
    </div>

    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
      <h3 class="text-lg font-bold text-gray-800 mb-3">Lịch học hôm nay</h3>
      <p class="text-sm text-gray-600">Môn Toán Nâng Cao - 18:00 đến 20:00 (Phòng A102)</p>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        window.authService.requireAuth(['STUDENT']);
      });
    </script>
  </main>

</body>
</html>
