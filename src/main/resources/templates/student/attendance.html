<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<head><title>Điểm Danh</title></head>
<body>
<div th:fragment="content">
  <div class="mb-6 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-800">Lịch Sử Điểm Danh</h1>
    <button onclick="exportAttendance()" class="flex items-center px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors text-sm font-medium shadow-sm">
      <i class="fas fa-file-csv mr-2"></i> Xuất CSV
    </button>
  </div>

  <!-- Stats cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="statsCards">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-3">
      <div class="p-2 bg-gray-100 text-gray-600 rounded-lg"><i class="fas fa-calendar-check text-lg"></i></div>
      <div><p class="text-xs text-gray-500">Tổng buổi</p><p class="text-xl font-bold" id="statTotal">0</p></div>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-3">
      <div class="p-2 bg-green-100 text-green-600 rounded-lg"><i class="fas fa-check text-lg"></i></div>
      <div><p class="text-xs text-gray-500">Có mặt</p><p class="text-xl font-bold text-green-600" id="statPresent">0</p></div>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-3">
      <div class="p-2 bg-red-100 text-red-600 rounded-lg"><i class="fas fa-times text-lg"></i></div>
      <div><p class="text-xs text-gray-500">Vắng</p><p class="text-xl font-bold text-red-600" id="statAbsent">0</p></div>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-3">
      <div class="p-2 bg-blue-100 text-blue-600 rounded-lg"><i class="fas fa-percent text-lg"></i></div>
      <div><p class="text-xs text-gray-500">Tỉ lệ đi học</p><p class="text-xl font-bold text-blue-600" id="statRate">0%</p></div>
    </div>
  </div>

  <!-- Filter -->
  <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4 items-center mb-6">
    <div class="flex items-center space-x-2">
      <input type="date" id="filterFrom" class="border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500" onchange="ListHelper.setFilter('from', this.value)">
      <span class="text-gray-400">→</span>
      <input type="date" id="filterTo" class="border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500" onchange="ListHelper.setFilter('to', this.value)">
    </div>
    <select id="filterStatus" class="border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500" onchange="ListHelper.setFilter('status', this.value)">
      <option value="">Tất cả trạng thái</option>
      <option value="PRESENT">Có mặt</option>
      <option value="ABSENT">Vắng</option>
      <option value="EXCUSED">Có phép</option>
      <option value="CANCELLED">Hủy</option>
    </select>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse min-w-[600px]">
        <thead>
          <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider border-b">
            <th th:replace="~{layout/fragments/sort-header :: sortHeader('Ngày', 'sessionDate')}"></th>
            <th class="px-4 py-3 font-medium">Khóa học</th>
            <th class="px-4 py-3 font-medium">Giáo viên</th>
            <th class="px-4 py-3 font-medium">Trạng thái</th>
            <th class="px-4 py-3 font-medium">Ghi chú</th>
          </tr>
        </thead>
        <tbody id="attendanceTableBody" class="text-sm text-gray-700 divide-y divide-gray-100">
        </tbody>
      </table>
    </div>
    <div th:replace="~{layout/fragments/pagination :: pagination}"></div>
  </div>

<script src="/js/list-helper.js"></script>
  <script src="/js/student/attendance.js"></script>
</div>
</body>
</html>
