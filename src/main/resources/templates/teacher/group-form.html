<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>
  <main class="max-w-3xl mx-auto space-y-6">
    <div class="flex items-center space-x-4">
      <button onclick="window.history.back()" class="text-gray-500 hover:text-gray-700">
        &larr; Quay lại
      </button>
      <h2 class="text-2xl font-bold text-gray-800">Thông tin Lớp / Nhóm</h2>
    </div>

    <div id="error-msg" class="text-red-600 text-sm"></div>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <form id="group-form" onsubmit="GroupManager.submitForm(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tên nhóm *</label>
          <input type="text" name="name" required class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">ID Khóa học *</label>
          <input type="number" name="courseId" required class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500" placeholder="Nhập ID khóa học">
          <p class="text-xs text-gray-500 mt-1">Lấy ID ở trang Quản lý Khóa học.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Ngày bắt đầu</label>
            <input type="date" name="startDate" class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Ngày kết thúc</label>
            <input type="date" name="endDate" class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
          <select name="status" class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
            <option value="ACTIVE">Hoạt động (ACTIVE)</option>
            <option value="INACTIVE">Ngưng (INACTIVE)</option>
            <option value="COMPLETED">Hoàn thành (COMPLETED)</option>
          </select>
        </div>

        <div class="pt-4 flex justify-end">
          <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-medium">Lưu nhóm</button>
        </div>
      </form>
    </div>

    <script th:src="@{/js/group.js}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        window.authService.requireAuth(['TEACHER']);
        GroupManager.init('TEACHER');
        const urlParams = new URLSearchParams(window.location.search);
        GroupManager.loadFormData(urlParams.get('id'));
      });
    </script>
  </main>
</body>
</html>
