<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>
  <main class="space-y-6">
    <div class="flex items-center space-x-4">
      <button onclick="window.history.back()" class="text-gray-500 hover:text-gray-700">
        &larr; Quay lại
      </button>
      <h2 class="text-2xl font-bold text-gray-800">Chi tiết Hóa đơn #<span id="inv-id"></span></h2>
    </div>

    <div id="error-msg" class="text-red-600 text-sm"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Thông tin chung -->
      <div class="lg:col-span-2 space-y-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
          <div class="flex justify-between items-start mb-6">
            <div>
              <h3 class="text-lg font-bold text-gray-800">Thông tin Hóa đơn</h3>
              <p class="text-sm text-gray-500">Học sinh: <span id="inv-student" class="font-medium text-gray-800"></span></p>
              <p class="text-sm text-gray-500">Kỳ: <span id="inv-period" class="font-medium text-gray-800"></span></p>
            </div>
            <div class="text-right">
              <p class="text-sm text-gray-500">Trạng thái thanh toán: <span id="inv-status" class="font-bold text-blue-600"></span></p>
              <p class="text-sm text-gray-500">Trạng thái chốt: <span id="inv-doc-status" class="font-bold text-gray-800"></span></p>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-4 mb-6 border-t border-b py-4">
            <div class="text-center">
              <p class="text-xs text-gray-500 uppercase">Tổng tiền</p>
              <p id="inv-total" class="text-xl font-bold text-gray-800"></p>
            </div>
            <div class="text-center border-l border-r">
              <p class="text-xs text-gray-500 uppercase">Đã trả</p>
              <p id="inv-paid" class="text-xl font-bold text-green-600"></p>
            </div>
            <div class="text-center">
              <p class="text-xs text-gray-500 uppercase">Còn nợ</p>
              <p id="inv-remain" class="text-xl font-bold text-red-600"></p>
            </div>
          </div>

          <div class="flex space-x-3">
            <button id="regenerate-btn" onclick="InvoiceManager.regenerateInvoice(document.getElementById('inv-id').textContent)" class="hidden px-4 py-2 bg-yellow-100 text-yellow-800 rounded font-medium text-sm hover:bg-yellow-200">Cập nhật lại từ Điểm danh (Regenerate)</button>
            <button onclick="InvoiceManager.finalizeInvoice(document.getElementById('inv-id').textContent)" class="px-4 py-2 bg-gray-800 text-white rounded font-medium text-sm hover:bg-gray-900">Chốt sổ hóa đơn (Finalize)</button>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <div class="p-4 border-b border-gray-200">
            <h3 class="text-lg font-bold text-gray-800">Chi tiết các buổi học</h3>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-gray-100 text-gray-600 text-sm uppercase tracking-wider border-b">
                  <th class="px-4 py-3 font-medium">Ngày học</th>
                  <th class="px-4 py-3 font-medium">Khóa học</th>
                  <th class="px-4 py-3 font-medium">Điểm danh</th>
                  <th class="px-4 py-3 font-medium">Đơn giá</th>
                </tr>
              </thead>
              <tbody id="details-tbody">
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Thanh toán -->
      <div class="space-y-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
          <h3 class="text-lg font-bold text-gray-800 mb-4">Ghi nhận thanh toán</h3>
          <form id="payment-form" onsubmit="InvoiceManager.recordPayment(event)" class="space-y-4">
            <input type="hidden" name="invoiceId" id="pay-invoice-id">
            
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Số tiền (VNĐ)</label>
              <input type="number" name="amount" required min="1" class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
            </div>
            
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Phương thức</label>
              <select name="method" class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
                <option value="BANK_TRANSFER">Chuyển khoản (BANK_TRANSFER)</option>
                <option value="CASH">Tiền mặt (CASH)</option>
                <option value="MOMO">Momo</option>
                <option value="OTHER">Khác</option>
              </select>
            </div>
            
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Ghi chú</label>
              <input type="text" name="note" class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
            </div>

            <button type="submit" class="w-full px-4 py-2 bg-green-600 text-white rounded font-medium hover:bg-green-700">Lưu Thanh toán</button>
          </form>
        </div>
      </div>

    </div>

    <script th:src="@{/js/invoice.js}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        window.authService.requireAuth(['TEACHER', 'ADMIN']);
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        
        // Xác định role để set API base
        const userStr = localStorage.getItem('user');
        if (userStr) {
            const user = JSON.parse(userStr);
            InvoiceManager.init(user.role);
            
            if (id) {
                document.getElementById('pay-invoice-id').value = id;
                InvoiceManager.loadInvoiceDetail(id);
            }
        }
      });
    </script>
  </main>
</body>
</html>
