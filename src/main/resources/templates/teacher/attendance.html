<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>
  <main class="space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-4 sm:space-y-0">
      <h2 class="text-2xl font-bold text-gray-800">Điểm Danh</h2>
      <a id="btnExport" href="#" target="_blank" class="px-4 py-2 border border-green-600 text-green-600 rounded-lg shadow-sm hover:bg-green-50 transition flex items-center space-x-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <span>Xuất Excel/CSV</span>
      </a>
    </div>

    <!-- Chọn buổi học -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
      <label class="block text-sm font-medium text-gray-700 mb-2">Chọn buổi học hôm nay (hoặc sắp tới):</label>
      <select id="sessionSelect" class="w-full md:w-1/2 border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-base py-2" onchange="AttendanceManager.loadAttendance(this.value)">
        <option value="">-- Chọn buổi học --</option>
      </select>
    </div>

    <!-- Danh sách học sinh -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="bg-gray-50 px-6 py-3 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-lg font-medium text-gray-800">Danh sách học sinh</h3>
        <button id="btnSave" onclick="AttendanceManager.saveAttendance()" class="hidden px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition">
          Lưu Điểm Danh
        </button>
      </div>
      
      <div id="attendanceList" class="divide-y divide-gray-100">
        <!-- Render by JS -->
        <div class="p-6 text-center text-gray-500">Vui lòng chọn buổi học để điểm danh.</div>
      </div>
    </div>

    <script th:src="@{/js/teacher/attendance.js}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        window.authService.requireAuth(['TEACHER']);
        AttendanceManager.init();
      });
    </script>
  </main>
</body>
</html>
