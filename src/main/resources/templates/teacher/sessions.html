<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>
  <main class="space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-4 sm:space-y-0">
      <h2 class="text-2xl font-bold text-gray-800">Lịch Học</h2>
      <div class="flex space-x-3">
        <a href="/teacher/session-form" class="px-4 py-2 border border-blue-600 text-blue-600 rounded-lg shadow-sm hover:bg-blue-50 transition">
          Tạo 1 buổi
        </a>
        <button onclick="SessionManager.openBulkModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition flex items-center space-x-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span>Tạo hàng loạt</span>
        </button>
      </div>
    </div>

    <!-- Search & Filter -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4 items-center">
      <div class="w-full md:w-auto">
        <select id="filterGroup" class="w-full md:w-64 border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500" onchange="ListHelper.setFilter('groupId', this.value)">
          <option value="">Tất cả nhóm</option>
        </select>
      </div>
      <div class="flex items-center space-x-2 w-full md:w-auto">
        <input type="date" id="filterFrom" class="border-gray-300 rounded-md text-sm p-2" onchange="ListHelper.setFilter('from', this.value)">
        <span class="text-gray-500">-</span>
        <input type="date" id="filterTo" class="border-gray-300 rounded-md text-sm p-2" onchange="ListHelper.setFilter('to', this.value)">
      </div>
      <div class="w-full md:w-auto ml-auto">
        <select id="filterStatus" class="border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500" onchange="ListHelper.setFilter('status', this.value)">
          <option value="">Tất cả trạng thái</option>
          <option value="SCHEDULED">Sắp tới</option>
          <option value="COMPLETED">Đã học</option>
          <option value="CANCELLED">Đã hủy</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider border-b">
              <th class="px-4 py-3 font-medium">Nhóm</th>
              <th th:replace="~{layout/fragments/sort-header :: sortHeader('Ngày Học', 'date')}"></th>
              <th class="px-4 py-3 font-medium">Thời gian</th>
              <th class="px-4 py-3 font-medium">Phòng</th>
              <th class="px-4 py-3 font-medium">Trạng thái</th>
              <th class="px-4 py-3 font-medium text-center">Đã điểm danh</th>
              <th class="px-4 py-3 font-medium text-right border-l border-gray-200">Hành động</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Render by JS -->
          </tbody>
        </table>
      </div>
      
      <!-- Pagination -->
      <div th:replace="~{layout/fragments/pagination :: pagination}"></div>
    </div>

    <!-- Modal Bulk Create -->
    <div id="bulkModal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-black bg-opacity-50">
        <div class="flex items-center justify-center min-h-screen px-4 py-10">
            <div class="bg-white rounded-xl shadow-lg w-full max-w-lg overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-gray-900">Tạo Lịch Học Hàng Loạt</h3>
                    <button type="button" onclick="SessionManager.closeBulkModal()" class="text-gray-400 hover:text-gray-500">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <form id="bulkForm" class="p-6 space-y-4" onsubmit="SessionManager.submitBulkCreate(event)">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nhóm học *</label>
                        <select id="bulkGroupId" name="groupId" required class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"></select>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Từ ngày *</label>
                            <input type="date" name="startDate" required class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Đến ngày *</label>
                            <input type="date" name="endDate" required class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Thứ trong tuần *</label>
                        <div class="flex flex-wrap gap-3">
                            <label class="flex items-center space-x-2"><input type="checkbox" name="daysOfWeek" value="1" class="rounded text-blue-600"> <span>T2</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" name="daysOfWeek" value="2" class="rounded text-blue-600"> <span>T3</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" name="daysOfWeek" value="3" class="rounded text-blue-600"> <span>T4</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" name="daysOfWeek" value="4" class="rounded text-blue-600"> <span>T5</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" name="daysOfWeek" value="5" class="rounded text-blue-600"> <span>T6</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" name="daysOfWeek" value="6" class="rounded text-blue-600"> <span>T7</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" name="daysOfWeek" value="7" class="rounded text-blue-600"> <span>CN</span></label>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Giờ bắt đầu *</label>
                            <input type="time" name="startTime" required class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Giờ kết thúc *</label>
                            <input type="time" name="endTime" required class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phòng học</label>
                        <input type="text" name="room" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div class="pt-4 flex justify-end space-x-3">
                        <button type="button" onclick="SessionManager.closeBulkModal()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition">Hủy</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition shadow-sm">Tạo lịch học</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/js/teacher/session.js}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        window.authService.requireAuth(['TEACHER']);
        SessionManager.init();
      });
    </script>
  </main>
</body>
</html>
