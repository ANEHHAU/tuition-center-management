<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>
  <main class="space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">Xin chào, <span id="welcomeName">Giáo viên</span>! 👋</h2>
        <p class="text-gray-500 mt-1">Chúc bạn một ngày làm việc hiệu quả.</p>
      </div>
      <div class="hidden sm:flex space-x-3">
        <a href="/teacher/attendance" class="px-4 py-2 bg-blue-50 text-blue-700 rounded-lg font-medium hover:bg-blue-100 transition">Điểm danh</a>
        <a href="/teacher/course-form" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium shadow hover:bg-blue-700 transition">Tạo khóa học</a>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4">
        <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>
        <div>
          <p class="text-sm font-medium text-gray-500">Khóa học</p>
          <p class="text-2xl font-bold text-gray-900" id="statCourses">0</p>
        </div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4">
        <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        </div>
        <div>
          <p class="text-sm font-medium text-gray-500">Nhóm lớp</p>
          <p class="text-2xl font-bold text-gray-900" id="statGroups">0</p>
        </div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4">
        <div class="w-12 h-12 rounded-full bg-yellow-100 flex items-center justify-center text-yellow-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </div>
        <div>
          <p class="text-sm font-medium text-gray-500">Học sinh</p>
          <p class="text-2xl font-bold text-gray-900" id="statStudents">0</p>
        </div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4">
        <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center text-green-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <div>
          <p class="text-sm font-medium text-gray-500">Doanh thu tháng</p>
          <p class="text-2xl font-bold text-green-600" id="statRevenue">0 đ</p>
        </div>
      </div>
    </div>

    <!-- 2 Cột: Buổi học hôm nay & Thanh toán gần đây -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- Buổi học hôm nay -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
          <h3 class="font-bold text-gray-800">Buổi học hôm nay</h3>
          <a href="/teacher/sessions" class="text-sm text-blue-600 hover:underline">Xem lịch học</a>
        </div>
        <div class="p-5 space-y-3" id="todaySessions">
          <!-- JS render -->
        </div>
      </div>

      <!-- Thanh toán gần đây -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
          <h3 class="font-bold text-gray-800">Thanh toán gần đây</h3>
          <a href="/teacher/invoices" class="text-sm text-blue-600 hover:underline">Tất cả hóa đơn</a>
        </div>
        <div class="p-5" id="recentPayments">
          <!-- JS render -->
        </div>
      </div>
    </div>

    <script th:src="@{/js/teacher/dashboard.js}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        window.authService.requireAuth(['TEACHER']);
        DashboardManager.init();
      });
    </script>
  </main>
</body>
</html>
