<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>
  <main class="space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-4 sm:space-y-0">
      <h2 class="text-2xl font-bold text-gray-800">Báo cáo & Thống kê</h2>
    </div>

    <div id="error-msg" class="text-red-600 text-sm"></div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Doanh thu -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col">
        <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
          <h3 class="text-lg font-bold text-gray-800">Doanh thu (Đã thu)</h3>
        </div>
        <div class="p-4 border-b border-gray-200">
          <div class="flex space-x-2 items-end">
            <div class="flex-1">
              <label class="block text-xs text-gray-500 mb-1">Từ ngày</label>
              <input type="date" id="rev-from" class="w-full border rounded px-2 py-1 text-sm">
            </div>
            <div class="flex-1">
              <label class="block text-xs text-gray-500 mb-1">Đến ngày</label>
              <input type="date" id="rev-to" class="w-full border rounded px-2 py-1 text-sm">
            </div>
            <button id="btn-load-rev" class="px-3 py-1 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">Lọc</button>
          </div>
        </div>
        <div class="p-6 text-center border-b border-gray-200">
          <p class="text-sm text-gray-500 uppercase tracking-wider mb-1">Tổng doanh thu</p>
          <p id="total-revenue" class="text-3xl font-bold text-green-600">0đ</p>
        </div>
        <div class="flex-1 overflow-auto max-h-64">
          <table class="w-full text-left border-collapse text-sm">
            <thead class="bg-gray-50 sticky top-0">
              <tr>
                <th class="px-4 py-2 font-medium text-gray-600">Giáo viên</th>
                <th class="px-4 py-2 font-medium text-gray-600">Doanh thu</th>
              </tr>
            </thead>
            <tbody id="revenue-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Công nợ -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col">
        <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
          <h3 class="text-lg font-bold text-gray-800">Công nợ Học sinh</h3>
          <button id="btn-load-debt" class="px-3 py-1 bg-gray-800 text-white rounded text-sm hover:bg-gray-900">Làm mới</button>
        </div>
        <div class="flex-1 overflow-auto max-h-[400px]">
          <table class="w-full text-left border-collapse text-sm">
            <thead class="bg-gray-50 sticky top-0">
              <tr>
                <th class="px-4 py-2 font-medium text-gray-600">ID</th>
                <th class="px-4 py-2 font-medium text-gray-600">Học sinh</th>
                <th class="px-4 py-2 font-medium text-gray-600">Số HĐ nợ</th>
                <th class="px-4 py-2 font-medium text-gray-600">Tổng nợ</th>
                <th class="px-4 py-2 font-medium text-gray-600">Nợ từ</th>
              </tr>
            </thead>
            <tbody id="debt-tbody"></tbody>
          </table>
        </div>
      </div>

    </div>

    <script th:src="@{/js/report.js}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        window.authService.requireAuth(['TEACHER', 'ADMIN']);
        const userStr = localStorage.getItem('user');
        if (userStr) {
            const user = JSON.parse(userStr);
            ReportManager.init(user.role);
            
            // Default dates to current month
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
            document.getElementById('rev-from').value = firstDay;
            document.getElementById('rev-to').value = lastDay;

            document.getElementById('btn-load-rev').onclick = () => {
                const f = document.getElementById('rev-from').value;
                const t = document.getElementById('rev-to').value;
                ReportManager.loadRevenue(f ? f + 'T00:00:00' : null, t ? t + 'T23:59:59' : null);
            };

            document.getElementById('btn-load-debt').onclick = () => ReportManager.loadDebt();

            // Initial load
            document.getElementById('btn-load-rev').click();
            document.getElementById('btn-load-debt').click();
        }
      });
    </script>
  </main>
</body>
</html>
