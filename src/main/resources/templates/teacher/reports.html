<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::main})}">
<body>
  <main class="space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-4 sm:space-y-0">
      <h2 class="text-2xl font-bold text-gray-800">Báo Cáo Thống Kê</h2>
      <div class="flex space-x-2 items-center bg-white p-2 rounded-lg border border-gray-200 shadow-sm">
        <input type="date" id="fromDate" class="border-none text-sm focus:ring-0">
        <span class="text-gray-400">-</span>
        <input type="date" id="toDate" class="border-none text-sm focus:ring-0">
        <button onclick="ReportManager.loadAll()" class="px-3 py-1 bg-gray-100 text-gray-700 rounded hover:bg-gray-200 text-sm font-medium transition">Lọc</button>
      </div>
    </div>

    <!-- Overview Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Doanh thu -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center space-x-2">
            <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Tổng Doanh Thu</span>
        </h3>
        <p class="text-3xl font-bold text-green-600" id="totalRevenue">0 đ</p>
        <div class="mt-6">
            <h4 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-3">Doanh thu theo khóa học</h4>
            <div id="courseRevenueList" class="space-y-1">
                <!-- JS render -->
            </div>
        </div>
      </div>

      <!-- Top Students -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center space-x-2">
            <svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
            <span>Top Học Sinh Chăm Chỉ</span>
        </h3>
        <div id="topStudentsList" class="space-y-1">
            <!-- JS render -->
        </div>
      </div>
    </div>

    <!-- Chi tiết tỷ lệ đi học -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-semibold text-gray-800">Tỷ lệ đi học</h3>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider border-b">
              <th class="px-4 py-3 font-medium">Học sinh</th>
              <th class="px-4 py-3 font-medium text-center">Có mặt</th>
              <th class="px-4 py-3 font-medium text-center">Vắng</th>
              <th class="px-4 py-3 font-medium text-center">Có phép</th>
              <th class="px-4 py-3 font-medium text-center">Tổng số buổi</th>
              <th class="px-4 py-3 font-medium text-right">Tỷ lệ</th>
            </tr>
          </thead>
          <tbody id="attendanceRateBody" class="divide-y divide-gray-100">
            <!-- JS render -->
          </tbody>
        </table>
      </div>
    </div>

    <script th:src="@{/js/teacher/report.js}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        window.authService.requireAuth(['TEACHER']);
        ReportManager.init();
      });
    </script>
  </main>
</body>
</html>
